<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamza Islah</title>
<meta name="description" content="Hamza Islah, PhD candidate at Mohammed VI Polytechnic University working on constraint programming and machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<body>

<a class="skip" href="#main">Skip to content</a>

<div class="shell">

  <aside class="rail">
    <h1 class="name" id="name">Hamza Islah</h1>

    <p class="affil" id="affil"></p>

    <ul class="links" id="links"></ul>

    <a class="resume-btn" id="resumeLink" hidden>Download resume<span>PDF</span></a>

      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>

  <main id="main">

    <p class="load-error" id="loadError" hidden></p>

    <section class="hero">
      <img class="portrait" id="portrait" src="assets/portrait.jpg" alt="Hamza Islah">

      <div class="rows" id="experience-list"></div>
    </section>

    <section id="education" class="section">
      <h2>Education</h2>
      <div class="rows" id="education-list"></div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p class="contact-line" id="contact-email"></p>
    </section>

<script src="js/app.js"></script>
